<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" width="240" height="80" fill="none">
  <!-- CHIPS Main Wordmark -->
  <g id="chips-mark">
    <!-- CH in Deep Blue -->
    <text x="10" y="42" font-family="'Outfit', 'Noto Sans', sans-serif" font-weight="900" font-size="34" fill="#0E3A75" letter-spacing="1">CH</text>
    <!-- I with Red/Orange Accent dot -->
    <text x="68" y="42" font-family="'Outfit', 'Noto Sans', sans-serif" font-weight="900" font-size="34" fill="#0E3A75">I</text>
    <circle cx="73" cy="16" r="4.5" fill="#E65100" />
    <circle cx="73" cy="16" r="2.5" fill="#FFB300" />
    <!-- PS in Deep Blue -->
    <text x="86" y="42" font-family="'Outfit', 'Noto Sans', sans-serif" font-weight="900" font-size="34" fill="#0E3A75" letter-spacing="1">PS</text>
  </g>
  
  <!-- Subtitle: Chhattisgarh Infotech Promotion Society -->
  <text x="12" y="58" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#1E293B" letter-spacing="0.3">Chhattisgarh Infotech</text>
  <text x="12" y="71" font-family="'Noto Sans', 'Segoe UI', sans-serif" font-weight="700" font-size="11" fill="#1E293B" letter-spacing="0.3">Promotion Society</text>
