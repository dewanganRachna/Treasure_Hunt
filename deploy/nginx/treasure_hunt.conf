# Chhattisgarh Digital Explorer (Treasure Hunt), served at __URL_PATH__/ behind an admin login.
#
# install.sh fills in the __PLACEHOLDERS__, saves this as /etc/nginx/snippets/ (mode 600, it
# holds the session token) and adds one `include` line for it inside your existing server
# block. Nothing else in your nginx configuration is changed.
#
# How the login works:
#   - __URL_PATH__/login/ is public: a small page asking for the admin ID and password.
#   - It sends them to __URL_PATH__/auth, where nginx checks them against __HTPASSWD__
#     (hashed) and, if right, sets the th_session cookie for __COOKIE_MAX_AGE__ seconds.
#   - Every other file of the game needs that cookie; without it you are sent to the login page.
#   - __URL_PATH__/logout clears the cookie on that device.
#   - __URL_PATH__/api/certificate forwards wins to __CERT_API_URL__ (logged-in kiosks only).
#
# Only `expires` is used for the game's files, never `add_header`, so headers your server
# block already sets (HSTS, CSP, ...) still apply to them.

# /treasure_hunt → /treasure_hunt/ (relative, so it works behind HTTPS proxies too)
location = __URL_PATH__ {
    absolute_redirect off;
    return 301 __URL_PATH__/;
}

# Login page: public
location ^~ __URL_PATH__/login/ {
    root __WEB_ROOT__;
    try_files $uri $uri/ __URL_PATH__/login/index.html;
    expires -1;
}

# Checks the admin ID and password, then sets the session cookie
location = __URL_PATH__/auth {
__LOGIN_LIMIT__
    auth_basic "Treasure Hunt admin";
    auth_basic_user_file __HTPASSWD__;
    # Wrong password → 403 rather than 401, so the browser doesn't pop up its own login box
    error_page 401 =403 @treasure_hunt_denied;
    root __WEB_ROOT__;
    # `return` would run before the password check, so answer with a tiny file instead
    try_files __URL_PATH__/login/ok.txt =404;
    expires -1;
    add_header Set-Cookie "th_session=__SESSION_TOKEN__; Path=__URL_PATH__/; Max-Age=__COOKIE_MAX_AGE__; HttpOnly; SameSite=Lax__COOKIE_SECURE__";
}

location @treasure_hunt_denied {
    default_type text/plain;
    return 403 "denied\n";
}

# Certificate API (Rajyotsav). The game posts each win here and nginx forwards it, so the
# browser never calls another site (no CORS needed) and only logged-in kiosks can create
# certificates. Our session cookie is not passed on.
location = __URL_PATH__/api/certificate {
    if ($cookie_th_session != "__SESSION_TOKEN__") { return 403; }
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass __CERT_API_URL__;
    proxy_ssl_server_name on;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
}

location = __URL_PATH__/logout {
    absolute_redirect off;
    add_header Set-Cookie "th_session=; Path=__URL_PATH__/; Max-Age=0; HttpOnly; SameSite=Lax__COOKIE_SECURE__";
    return 302 __URL_PATH__/login/;
}

# The game. ^~ keeps any regex locations in the server block (e.g. caching rules for
# .js/.css) from taking over its files. Nested locations don't inherit `if`, so each one
# checks the cookie itself.
location ^~ __URL_PATH__/ {
    absolute_redirect off;
    if ($cookie_th_session != "__SESSION_TOKEN__") { return 302 __URL_PATH__/login/; }

    root __WEB_ROOT__;
    index index.html;
    try_files $uri $uri/ __URL_PATH__/index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Build files have a content hash in their names, so they can be cached for a year
    location ^~ __URL_PATH__/assets/ {
        if ($cookie_th_session != "__SESSION_TOKEN__") { return 403; }
        expires 1y;
        try_files $uri =404;
    }

    location ^~ __URL_PATH__/map/ {
        if ($cookie_th_session != "__SESSION_TOKEN__") { return 403; }
        expires 7d;
        try_files $uri =404;
    }

    # Always revalidate the page itself so a new deploy (or a logout) takes effect on the next load
    location = __URL_PATH__/index.html {
        absolute_redirect off;
        if ($cookie_th_session != "__SESSION_TOKEN__") { return 302 __URL_PATH__/login/; }
        expires -1;
    }
}
